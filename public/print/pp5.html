<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ปพ.5 — แบบบันทึกผลการพัฒนาคุณภาพผู้เรียนรายวิชา</title>
<link rel="stylesheet" href="/print/print.css">
</head>
<body>
<div id="doc"><div class="status">กำลังเตรียมเอกสาร…</div></div>
<script type="module">
// ปพ.5 ทั้งเล่ม เรียงตามที่โรงเรียนกำหนด:
// 1 ปก (สรุปผล + การอนุมัติ) → 2 โครงสร้างรายวิชา → 3 บันทึกเวลาเรียน → 4 อ่าน คิดวิเคราะห์ เขียน
// → 5 คุณลักษณะอันพึงประสงค์ → 6 ผลการประเมินตัวชี้วัด (รายภาค) → 7 สรุปผลการประเมิน (รายภาค + ทั้งปี)
// ตัวเลขทุกตัวอ่านจากผลที่เซิร์ฟเวอร์คำนวณแล้ว (computed) — ไม่คำนวณคะแนนใหม่ในหน้านี้
// ?course=ID = 1 วิชา, ?courses=1,2,3 หรือ ?grade=ป.4&room=2&year=ID = ทุกวิชาของห้องเป็นไฟล์เดียว
// ?term=1 = เล่มภาคเรียนที่ 1: ปก (สรุปคะแนนภาค 1) → โครงสร้างภาค 1 → เวลาเรียนภาค 1 → ตัวชี้วัดภาค 1 → สรุปผลภาค 1
// ?term=2 (หรือไม่ระบุ) = เล่มภาคเรียนที่ 2 สรุปทั้งปี: ทุกส่วนข้างต้นของทั้งสองภาค + อ่านคิดฯ คุณลักษณะ และสรุปผลการเรียนทั้งปี
import { fixed, esc, params, get, toolbar, status, fmt, td, gradeOut, thaiDateUtc, directorTitleHtml } from "/print/print.js";
import { indicatorResult, effectiveScore, indicatorWord, ASSESSMENT_GROUPS, summarizeGroup, summaryText, NUMERIC_GRADES } from "/js/grading.js";

const q = params();
const TERM = q.get("term") === "1" ? 1 : 2;
let ids = [];
try {
  if (q.get("course")) ids = [q.get("course")];
  else if (q.get("courses")) ids = q.get("courses").split(",").filter(Boolean);
  else if (q.get("grade") && q.get("room")) {
    const r = await get(`/api/reports/room-courses?grade=${encodeURIComponent(q.get("grade"))}&room=${encodeURIComponent(q.get("room"))}${q.get("year") ? `&year=${encodeURIComponent(q.get("year"))}` : ""}`);
    ids = r.courses.filter((c) => c.item_count > 0).map((c) => c.id);
    if (!ids.length) throw new Error("ห้องนี้ยังไม่มีรายวิชาที่ตั้งโครงสร้างคะแนน");
  }
  if (!ids.length) throw new Error("ไม่ได้ระบุรายวิชา");
} catch (e) { status(e.message); throw e; }

const books = [];
for (const [i, id] of ids.entries()) {
  status(`กำลังเตรียมเอกสาร ${i + 1}/${ids.length}…`);
  try { books.push(await get(`/api/courses/${encodeURIComponent(id)}`)); } catch (e) { status(e.message); throw e; }
}
const first = books[0].course;
const termTitle = TERM === 1 ? "ภาคเรียนที่ 1" : "ภาคเรียนที่ 2 (สรุปทั้งปี)";
const title = books.length === 1 ? `ปพ.5 ${first.code} ${first.name} ${first.grade_level}/${first.classroom} ${termTitle}` : `ปพ.5 ทุกวิชา ${first.grade_level}/${first.classroom} (${books.length} วิชา) ${termTitle}`;
toolbar(title);
document.title = books.length === 1 ? `ปพ.5 ${first.code} ${first.grade_level}-${first.classroom} ภาค${TERM}` : `ปพ.5 ${first.grade_level}-${first.classroom} ทุกวิชา ภาค${TERM}`;

const statusNote = (x) => x.transfer_in_term ? `ย้ายเข้า` : x.enrollment_status === "transferred" ? "ย้ายออก" : x.enrollment_status === "withdrawn" ? "ออกกลางคัน" : x.enrollment_status === "moved" ? "ย้ายห้อง" : "ปกติ";
const pctOf = (n, all) => all ? fixed((n / all) * 100, 2) : td("0.00"); // ร้อยละ ตัดทศนิยมตำแหน่งที่ 3 ทิ้ง ไม่ปัด
const dots = (name, w = "................................................") => name ? esc(name) : w;
const chunk = (arr, n) => { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; };
// แบ่งให้แต่ละหน้ามีจำนวนเท่า ๆ กัน (ไม่เกิน n ต่อหน้า) เช่น 8 ตัว → 4 + 4 แทน 6 + 2 ที่หน้าหลังโล่ง
const chunkEven = (arr, n) => { const pages = Math.ceil(arr.length / n) || 1; return chunk(arr, Math.ceil(arr.length / pages) || n); };
// "ท 1.1 ป.4/2" → { std: "ท 1.1", no: "2" }
function splitCode(code) {
  const m = String(code || "").match(/^(.*?)\s*ป\.\s*\d\s*\/\s*(\d+)\s*$/);
  return m ? { std: m[1].trim(), no: m[2] } : { std: String(code || ""), no: "" };
}

function book(d) {
  const c = d.course, s = d.settings;
  const W = indicatorWord(c.grade_level);
  const active = d.students.filter((x) => x.enrollment_status === "enrolled");
  // ห้องใหญ่ (เกิน 25 คน): ตัวอักษร/ระยะบรรทัดเล็กลง ให้ตารางรายคนจบในหน้าเดียว (แนวนอนบีบมากกว่าแนวตั้ง)
  const dense = (land) => d.students.length > 25 ? (land ? " dense-l" : " dense") : "";
  // ลายน้ำฉบับร่าง: ผลทั้งปี (ภาค 2) ที่ยังไม่อนุมัติ — เล่มภาค 1 ไม่มีขั้นอนุมัติแยก (อนุมัติผลทั้งปีที่ภาค 2)
  const draft = TERM === 2 && c.status !== "approved";
  const mark = draft ? `<div class="draft-mark"><span>ฉบับร่าง ยังไม่อนุมัติ</span></div>` : "";
  const head = (t) => `<div class="center"><b>${t}${TERM === 1 && !/ภาคเรียนที่/.test(t) ? ` ภาคเรียนที่ ${td(1)}` : ""} ปีการศึกษา ${td(c.year_be)} วิชา ${esc(c.name)} รหัสวิชา ${esc(td(c.code))} ชั้น ${esc(td(c.grade_level))}/${esc(td(c.classroom))}</b></div>`;
  const band = /^ป\.[123]$/.test(c.grade_level) ? "ประถมศึกษาตอนต้น" : "ประถมศึกษาตอนปลาย";
  const terms = (TERM === 1 ? [1] : [1, 2]).filter((t) => d.items.some((i) => i.term_number === t));

  // ---------- 1. ปก + สรุปผล + การอนุมัติ ----------
  const cols = ["4", "3.5", "3", "2.5", "2", "1.5", "1", "0", "ร", "มส"];
  const count = Object.fromEntries(cols.map((g) => [g, active.filter((x) => d.computed[x.id].grade === g).length]));
  const graded = active.map((x) => d.computed[x.id].grade).filter((g) => NUMERIC_GRADES.includes(g)).map(Number);
  const mean = graded.length ? graded.reduce((a, b) => a + b, 0) / graded.length : null;
  const sd = graded.length > 1 ? Math.sqrt(graded.reduce((a, g) => a + (g - mean) ** 2, 0) / (graded.length - 1)) : graded.length ? 0 : null;
  const good = (count["4"] + count["3.5"] + count["3"]);
  const noResult = active.length - cols.reduce((a, g) => a + count[g], 0); // ยังไม่มีผล — ให้ยอดรวมตรงกับจำนวนนักเรียน
  const failN = count["0"] + count["ร"] + count["มส"];
  const two = (v) => v == null ? "–" : fixed(v, 2);
  const assessCount = (key) => {
    const g = ASSESSMENT_GROUPS.find((x) => x.key === key);
    const out = { 3: 0, 2: 0, 1: 0, 0: 0 };
    for (const x of active) { const v = summarizeGroup(g, d.assessments?.[x.id] || {}); if (v != null) out[v]++; else out.none = (out.none || 0) + 1; }
    return out;
  };
  const tr = assessCount("trait"), rw = assessCount("rtw");
  const assessRow = (o) => ["3", "2", "1", "0"].map((k) => `<td class="c">${td(o[k])}</td>`).join("");
  const assessPct = (o) => ["3", "2", "1", "0"].map((k) => `<td class="c">${pctOf(o[k], active.length)}</td>`).join("");
  const teacherNames = c.teachers.map((t) => t.full_name);
  const signLine = (role, name) => `<div class="sign-row"><span>ลงชื่อ</span><span class="fill"></span><span>${role}</span></div>${name ? `<div class="sign-name">(${esc(name)})</div>` : '<div class="sign-name">(................................................)</div>'}`;
  const decision = (role, name, dt) => `<div class="box">
      <div class="checks"><span>☐ อนุมัติ</span><span>☐ ไม่อนุมัติ/ให้นำไปปรับปรุงแก้ไข</span></div>
      ${signLine(role, name)}<div class="sign-name">${dt || "........../........../.........."}</div></div>`;
  // ปกเล่มภาคเรียนที่ 1: สรุปคะแนนภาค 1 (เต็ม 50) แทนการกระจายผลการเรียน ซึ่งออกเมื่อครบ 2 ภาค
  const t1Ids = new Set(d.items.filter((i) => i.term_number === 1 && i.kind === "indicator").map((i) => i.id));
  const t1 = active.map((x) => ({ x, t: d.computed[x.id].term_scores?.[1], failed: d.computed[x.id].failed_indicators.filter((id) => t1Ids.has(id)).length }));
  const t1Done = t1.filter((r) => r.t?.complete);
  const t1Totals = t1Done.map((r) => Number(r.t.total));
  const t1Mean = t1Totals.length ? t1Totals.reduce((a, b) => a + b, 0) / t1Totals.length : null;
  const t1Pass = t1Done.filter((r) => !r.failed).length, t1Fail = t1Done.filter((r) => r.failed).length;
  const term1Cover = `<table class="t small">
      <tr><th rowspan="2" style="width:20mm">จำนวน<br>นักเรียน<br>ทั้งหมด</th><th colspan="2">การกรอกคะแนน ภาค ${td(1)}</th><th colspan="3">คะแนนรวมภาค ${td(1)} (เต็ม ${td(50)})</th><th colspan="2">ผลการประเมิน${W} ภาค ${td(1)}</th></tr>
      <tr><th>ครบ</th><th>ยังไม่ครบ</th><th>เฉลี่ย</th><th>สูงสุด</th><th>ต่ำสุด</th><th>ผ่านทุก${W}</th><th>มี${W}ไม่ผ่าน</th></tr>
      <tr><td class="c">${td(active.length)}</td><td class="c">${td(t1Done.length)}</td><td class="c">${td(active.length - t1Done.length)}</td>
        <td class="c">${t1Mean == null ? "–" : fixed(t1Mean, 2)}</td><td class="c">${t1Totals.length ? fmt(Math.max(...t1Totals)) : "–"}</td><td class="c">${t1Totals.length ? fmt(Math.min(...t1Totals)) : "–"}</td>
        <td class="c">${td(t1Pass)}</td><td class="c">${td(t1Fail)}</td></tr>
      <tr><td class="c">คิดเป็นร้อยละ</td><td class="c">${pctOf(t1Done.length, active.length)}</td><td class="c">${pctOf(active.length - t1Done.length, active.length)}</td><td colspan="3"></td>
        <td class="c">${pctOf(t1Pass, active.length)}</td><td class="c">${pctOf(t1Fail, active.length)}</td></tr>
    </table>
    <div class="note" style="margin-top:1mm">เล่มภาคเรียนที่ ${td(1)}: คะแนนไม่ปัดเศษ · ค่าเฉลี่ย/สูงสุด/ต่ำสุดคิดจากนักเรียนที่กรอกคะแนนครบ · ${W}ไม่ผ่านนับหลังรวมคะแนนแก้ตัว
      · ผลการเรียน (เกรด) และผลการประเมินคุณลักษณะฯ อ่าน คิด วิเคราะห์ และเขียน สรุปในเล่มภาคเรียนที่ ${td(2)}</div>`;
  const cover = `<section class="sheet pp5">${mark}
    <div class="form-no">ปพ.5</div>
    <img class="garuda" src="/logo.png" alt="">
    <h1 class="center">แบบบันทึกผลการพัฒนาคุณภาพผู้เรียนรายวิชา</h1>
    <h2 class="center">โรงเรียน${esc(s.school_name?.replace(/^โรงเรียน/, "") || "วัดโบสถ์ (ราษฎร์รังสฤษฏ์)")} ${esc(s.school_address || "")}</h2>
    <h2 class="center">สังกัด ${esc(s.affiliation || "สำนักงานคณะกรรมการการศึกษาขั้นพื้นฐาน")}</h2>
    ${s.school_area ? `<h2 class="center">${esc(s.school_area)}</h2>` : ""}
    <div class="center" style="margin-top:2mm"><b>ภาคเรียนที่ ${td(TERM)} ปีการศึกษา ${td(c.year_be)}${TERM === 2 ? " (สรุปผลทั้งปี)" : ""}</b></div>
    <div class="center"><b>ชั้น ${esc(td(c.grade_level))}/${esc(td(c.classroom))} ระดับชั้น ${band}</b></div>
    <div class="info2">
      <div>กลุ่มสาระการเรียนรู้${esc(c.learning_area)}</div><div>สาระการเรียนรู้${c.subject_type === "basic" ? "พื้นฐาน" : "เพิ่มเติม"}</div>
      <div>รายวิชา ${esc(c.name)}</div><div>รหัสวิชา ${esc(td(c.code))}</div>
      <div>เวลาเรียน ${td(c.hours_per_year)} ชั่วโมงต่อปี</div><div>เวลาเรียน ${fmt(c.hours_per_year / 40)} ชั่วโมงต่อสัปดาห์</div>
      <div style="grid-column:1/-1">ครูผู้สอน ${dots(teacherNames.join(", "))}</div>
      <div style="grid-column:1/-1">ครูประจำชั้น ${dots((c.homeroom_teachers || []).join(", "))}</div>
    </div>
    ${TERM === 1 ? term1Cover : `<table class="t small">
      <tr><th rowspan="3" style="width:20mm">จำนวน<br>นักเรียน<br>ทั้งหมด</th><th colspan="10">สรุปผลการพัฒนาผู้เรียน</th><th rowspan="3" style="width:18mm">หมายเหตุ</th></tr>
      <tr><th colspan="10">จำนวนนักเรียนที่ได้รับผลการเรียน</th></tr>
      <tr>${cols.map((g) => `<th>${gradeOut(g === "มส" ? "มส." : g)}</th>`).join("")}</tr>
      <tr><td class="c">${td(active.length)}</td>${cols.map((g) => `<td class="c">${td(count[g])}</td>`).join("")}<td rowspan="2" class="small-note">${[terms.length < 2 ? "ผลการเรียนออกเมื่อครบ 2 ภาค" : "", noResult > 0 ? `ยังไม่มีผล ${td(noResult)} คน` : ""].filter(Boolean).join("<br>")}</td></tr>
      <tr><td class="c">คิดเป็นร้อยละ</td>${cols.map((g) => `<td class="c">${pctOf(count[g], active.length)}</td>`).join("")}</tr>
    </table>
    <div class="stats">
      <div>ร้อยละของนักเรียนที่ได้ผลการเรียนระดับดี (${td(3)}) ขึ้นไป ${pctOf(good, active.length)}</div><div>ผลการเรียนเฉลี่ยของรายวิชา ${two(mean)}</div>
      <div>ร้อยละของนักเรียนที่ไม่ผ่านการประเมิน ${pctOf(failN, active.length)}</div><div>ส่วนเบี่ยงเบนมาตรฐาน ${two(sd)}</div>
    </div>
    <table class="t small">
      <tr><th rowspan="2">ผลการประเมิน</th><th colspan="4">ผลการประเมินคุณลักษณะอันพึงประสงค์</th><th colspan="4">ผลการประเมินการอ่าน คิด วิเคราะห์ และเขียน</th></tr>
      <tr><th>ดีเยี่ยม</th><th>ดี</th><th>ผ่าน</th><th>ไม่ผ่าน</th><th>ดีเยี่ยม</th><th>ดี</th><th>ผ่าน</th><th>ไม่ผ่าน</th></tr>
      <tr><td class="c">จำนวนที่ได้</td>${assessRow(tr)}${assessRow(rw)}</tr>
      <tr><td class="c">คิดเป็นร้อยละ</td>${assessPct(tr)}${assessPct(rw)}</tr>
    </table>
    ${tr.none || rw.none ? `<div class="note" style="margin-top:1mm">ยังประเมินไม่ครบ: คุณลักษณะฯ ${td(tr.none || 0)} คน · อ่าน คิด วิเคราะห์ และเขียน ${td(rw.none || 0)} คน</div>` : ""}`}
    <div class="center" style="margin-top:3mm"><b>การอนุมัติผลการพัฒนาคุณภาพผู้เรียน</b></div>
    <div class="grid2">
      <div>${signLine("ครูผู้สอน", teacherNames[0])}</div><div>${signLine("หัวหน้ากลุ่มสาระการเรียนรู้", "")}</div>
      <div>${signLine("หัวหน้างานวัดผลและประเมินผล", s.measurement_head_name)}</div><div>${signLine("หัวหน้าฝ่ายวิชาการ", s.academic_head_name)}</div>
    </div>
    <div class="grid2" style="margin-top:2mm">
      <div><b>เรียนเพื่อเสนอโปรดพิจารณา</b>${(() => { const ds = String(s.deputy_director_name || "").split("\n").filter(Boolean);
        if (ds.length <= 1) return decision("รองผู้อำนวยการสถานศึกษา", ds[0] || "");
        return `<div class="box"><div class="checks"><span>☐ อนุมัติ</span><span>☐ ไม่อนุมัติ/ให้นำไปปรับปรุงแก้ไข</span></div>${ds.map((n) => signLine("รองผู้อำนวยการสถานศึกษา", n)).join("")}<div class="sign-name">........../........../..........</div></div>`; })()}</div>
      <div><b>การพิจารณา/สั่งการ</b>${decision(directorTitleHtml(s.school_name), s.director_name)}</div>
    </div>
    ${TERM === 1 ? `<div class="sys-note">เล่มภาคเรียนที่ ${td(1)} — ผลการเรียน (เกรด) การส่งผลและการอนุมัติผลทั้งปีอยู่ในเล่มภาคเรียนที่ ${td(2)}</div>`
      : c.status === "approved" ? `<div class="sys-note">อนุมัติในระบบ${c.approved_by_name ? ` โดย ${esc(c.approved_by_name)}` : ""} เมื่อ ${esc(thaiDateUtc(c.approved_at))}</div>`
      : c.status === "reviewed" ? `<div class="sys-note">ฝ่ายวัดผลตรวจแล้ว${c.reviewed_by_name ? ` (${esc(c.reviewed_by_name)})` : ""} รอผู้บริหารอนุมัติ</div>`
      : c.status === "submitted" ? `<div class="sys-note">ส่งผลในระบบแล้ว รอฝ่ายวัดผลตรวจ</div>` : ""}
  </section>`;

  // ---------- 6. ผลการประเมินตัวชี้วัด (รายภาค, หน้าละไม่เกิน 6 ตัว) ----------
  const indicatorPages = terms.map((term) => {
    const inds = d.items.filter((i) => i.term_number === term && i.kind === "indicator");
    if (!inds.length) return "";
    const order = Object.fromEntries(inds.map((it, k) => [it.id, k + 1]));
    // หน้าแนวนอนเสมอ กว้างเท่าที่ใช้จริง: ตัวชี้วัดละ 30 มม. (คะแนน 12 + แก้ตัว 10 + ผล 8)
    return chunkEven(inds, 6).map((part) => { const tw = 84 + part.length * 30; return `<section class="sheet land">${mark}
      ${head(`ผลการประเมิน${W} ภาคเรียนที่ ${td(term)}`)}
      <table class="t tiny fit${dense(true)}" style="table-layout:fixed;width:${tw}mm">
        <colgroup><col style="width:9mm"><col style="width:15mm"><col style="width:60mm">${part.map(() => '<col style="width:12mm"><col style="width:10mm"><col style="width:8mm">').join("")}</colgroup>
        <thead>
          <tr><th rowspan="4">เลขที่</th><th rowspan="4">เลข<br>ประจำตัว</th><th class="r">${W}ที่</th>${part.map((it) => `<th colspan="3">${td(order[it.id])}</th>`).join("")}</tr>
          <tr><th class="r">สาระ, มาตรฐาน</th>${part.map((it) => `<th colspan="3">${esc(td(splitCode(it.code).std || "–"))}</th>`).join("")}</tr>
          <tr><th class="r">${W}ข้อที่</th>${part.map((it) => `<th colspan="3">${esc(td(splitCode(it.code).no || "–"))}</th>`).join("")}</tr>
          <tr><th class="r">คะแนนเต็ม</th>${part.map((it) => `<th>${fmt(it.max_score)}</th><th class="xs">แก้ตัว</th><th class="xs">ผล</th>`).join("")}</tr>
        </thead>
        <tbody>${d.students.map((x) => {
          const sc = d.scores[x.id] || {}, rem = d.remedials?.[x.id] || {};
          return `<tr><td class="c">${td(x.number ?? "")}</td><td class="c">${esc(td(x.student_code))}</td><td class="nm">${esc(x.name)}</td>
            ${part.map((it) => {
              const eff = effectiveScore(it, sc[it.id] ?? null, rem[it.id] ?? null, d.settings);
              const res = eff == null ? "" : indicatorResult(it, eff, d.settings);
              return `<td class="c">${sc[it.id] == null ? "" : fmt(sc[it.id])}</td><td class="c">${rem[it.id] == null ? "" : fmt(rem[it.id])}</td><td class="c">${res}</td>`;
            }).join("")}</tr>`;
        }).join("")}</tbody>
      </table>
      <div class="note">${part.map((it) => `<b>${td(order[it.id])}</b> ${esc(td(it.code || ""))} ${esc(it.title)}`).join(" ; ")}</div>
    </section>`; }).join("");
  }).join("");

  // ---------- 7a. สรุปผลการประเมิน รายภาค ----------
  const cT = c.collect_ratio / 2, fT = 50 - cT;
  const termSummary = terms.map((term) => {
    const inds = d.items.filter((i) => i.term_number === term && i.kind === "indicator");
    const fins = d.items.filter((i) => i.term_number === term && i.kind === "final");
    return `<section class="sheet land">${mark}
      ${head(`สรุปผลการประเมิน${W} ภาคเรียนที่ ${td(term)}`)}
      <table class="t small fit${dense(true)}">
        <thead>
          <tr><th rowspan="2" style="width:10mm">เลขที่</th><th rowspan="2">ชื่อ–สกุล</th><th colspan="5">ระหว่างภาค</th><th colspan="3">สอบปลายภาค</th><th rowspan="2" style="width:16mm">รวม</th><th rowspan="2" style="width:20mm">สถานะ<br>นักเรียน</th></tr>
          <tr><th style="width:17mm">${W}</th><th style="width:15mm">กลางภาค</th><th style="width:15mm">แก้ตัว</th><th style="width:16mm">คะแนน<br>นับได้</th><th style="width:15mm">รวม</th>
            <th style="width:15mm">สอบ</th><th style="width:15mm">แก้ตัว</th><th style="width:15mm">รวม</th></tr>
          <tr><th></th><th class="r">คะแนนเต็ม</th><th>${fmt(cT)}</th><th>${td(0)}</th><th>${td(0)}</th><th>${fmt(cT)}</th><th>${fmt(cT)}</th><th>${fmt(fT)}</th><th>${td(0)}</th><th>${fmt(fT)}</th><th>${td(50)}</th><th></th></tr>
        </thead>
        <tbody>${d.students.map((x) => {
          const k = d.computed[x.id], t = k.term_scores?.[term], sc = d.scores[x.id] || {}, rem = d.remedials?.[x.id] || {};
          const raw = Number(inds.reduce((a, it) => a + (sc[it.id] == null ? 0 : Number(sc[it.id])), 0).toPrecision(12));
          const hasRem = inds.some((it) => rem[it.id] != null);
          // คะแนนที่ได้จากการแก้ตัว — เทียบได้เฉพาะเมื่อโครงสร้างตรงสัดส่วน (ไม่ย่อขยาย)
          const gain = t && t.exact ? Math.max(0, Number((t.collect - raw).toPrecision(12))) : 0;
          const blank = !t || !inds.some((it) => sc[it.id] != null);
          const finBlank = !t || !fins.some((it) => sc[it.id] != null);
          if (t?.carried) return `<tr><td class="c">${td(x.number ?? "")}</td><td class="nm">${esc(x.name)}</td>
            <td class="c" colspan="5">ยกมาจาก ปพ.6 โรงเรียนเดิม${t.collect != null ? ` (${fmt(t.collect)})` : ""}</td><td class="c" colspan="3">${t.final != null ? fmt(t.final) : ""}</td>
            <td class="c"><b>${fmt(t.total)}</b></td><td class="c">${statusNote(x)}</td></tr>`;
          return `<tr><td class="c">${td(x.number ?? "")}</td><td class="nm">${esc(x.name)}</td>
            <td class="c">${blank ? "" : fmt(raw)}</td><td class="c">${blank ? "" : td("0")}</td><td class="c">${hasRem ? fmt(gain) : blank ? "" : td("0")}</td>
            <td class="c">${blank ? "" : fmt(t.collect)}</td><td class="c">${blank ? "" : fmt(t.collect)}</td>
            <td class="c">${finBlank ? "" : fmt(t.final)}</td><td class="c">${finBlank ? "" : td("0")}</td><td class="c">${finBlank ? "" : fmt(t.final)}</td>
            <td class="c"><b>${t && t.complete ? fmt(t.total) : ""}</b></td><td class="c">${statusNote(x)}</td></tr>`;
        }).join("")}</tbody>
      </table>
      <div class="note">คะแนนนับได้ = คะแนน${W}หลังรวมการแก้ตัว (นับได้ไม่เกินเกณฑ์ผ่าน) · ไม่ปัดเศษ</div>
    </section>`;
  }).join("");

  // ---------- 7b. สรุปผลการเรียนทั้งปี ----------
  const yearSummary = `<section class="sheet">${mark}
    ${head("สรุปผลการเรียนรายวิชา")}
    <table class="t small fit${dense(false)}">
      <thead><tr><th style="width:10mm">เลขที่</th><th>ชื่อ–สกุล</th><th style="width:16mm">ภาค ${td(1)}</th><th style="width:16mm">ภาค ${td(2)}</th><th style="width:16mm">รวม</th>
        <th style="width:14mm">ผลการ<br>เรียน</th><th style="width:14mm">แก้ไข</th><th style="width:20mm">สถานะ</th></tr>
        <tr><th></th><th class="r">คะแนนเต็ม</th><th>${td(50)}</th><th>${td(50)}</th><th>${td(100)}</th><th>${td("0–4")}</th><th>${td("0–4")}</th><th></th></tr></thead>
      <tbody>${d.students.map((x) => {
        const k = d.computed[x.id], r = d.results[x.id] || {};
        const t1 = k.term_scores?.[1], t2 = k.term_scores?.[2];
        return `<tr><td class="c">${td(x.number ?? "")}</td><td class="nm">${esc(x.name)}</td>
          <td class="c">${t1 && t1.complete ? fmt(t1.total) : "–"}</td><td class="c">${t2 && t2.complete ? fmt(t2.total) : "–"}</td><td class="c">${k.total_max === 100 && k.total != null && !k.missing ? fmt(k.total) : "–"}</td>
          <td class="c"><b>${k.original_grade == null ? "–" : gradeOut(k.original_grade)}</b></td><td class="c">${r.remedial_grade ? gradeOut(r.remedial_grade) : ""}</td><td class="c">${statusNote(x)}</td></tr>`;
      }).join("")}</tbody>
    </table>
    <div class="note">${td("เกณฑ์: 80–100 = 4, 75–79.99 = 3.5, 70–74.99 = 3, 65–69.99 = 2.5, 60–64.99 = 2, 55–59.99 = 1.5, 50–54.99 = 1, 0–49.99 = 0")} · ตัดเกรดจากคะแนนจริง ไม่ปัดเศษ
      ${terms.length < 2 ? `<br>ยังมีคะแนนไม่ครบ ${td(2)} ภาคเรียน จึงยังไม่ตัดผลการเรียน (แสดง –)` : ""}</div>
  </section>`;

  // ---------- 4–5. อ่าน คิดวิเคราะห์ เขียน / คุณลักษณะอันพึงประสงค์ ----------
  const assessPage = (key) => {
    const g = ASSESSMENT_GROUPS.find((x) => x.key === key);
    return `<section class="sheet">${mark}
      ${head(g.title)}
      <table class="t small fit${dense(false)}">
        <thead><tr><th rowspan="2" style="width:10mm">เลขที่</th><th rowspan="2" style="width:16mm">เลข<br>ประจำตัว</th><th rowspan="2">ชื่อ–สกุล</th><th colspan="${g.items.length}">${key === "trait" ? "คุณลักษณะอันพึงประสงค์ข้อที่" : "ตัวชี้วัดข้อที่"}</th><th rowspan="2" style="width:22mm">สรุปผล</th></tr>
          <tr>${g.items.map((_, i) => `<th style="width:9mm">${td(i + 1)}</th>`).join("")}</tr></thead>
        <tbody>${d.students.map((x) => {
          const v = d.assessments?.[x.id] || {};
          const sum = summarizeGroup(g, v);
          return `<tr><td class="c">${td(x.number ?? "")}</td><td class="c">${esc(td(x.student_code))}</td><td class="nm">${esc(x.name)}</td>
            ${g.items.map(([k]) => `<td class="c">${v[k] == null ? "" : td(v[k])}</td>`).join("")}<td class="c">${summaryText(g, sum)}</td></tr>`;
        }).join("")}</tbody>
      </table>
      <div class="note">${g.items.map(([, label], i) => `${td(i + 1)}. ${esc(label)}`).join(" · ")}<br>ระดับ: ${td(3)} = ดีเยี่ยม, ${td(2)} = ดี, ${td(1)} = ผ่าน, ${td(0)} = ไม่ผ่าน · ประเมินโดยครูประจำชั้น</div>
    </section>`;
  };

  // ---------- 2. โครงสร้างรายวิชา ----------
  const units = (d.units || []);
  const structureRows = terms.flatMap((term) => {
    const tu = units.filter((u) => u.term_number === term);
    const rows = tu.map((u) => {
      const its = d.items.filter((i) => i.unit_id === u.id);
      const stds = [...new Set(its.map((i) => splitCode(i.code).std).filter(Boolean))];
      const nos = its.map((i) => splitCode(i.code).no).filter(Boolean);
      return `<tr><td class="c">${td(u.unit_no)}</td><td>${esc(u.title)}</td><td class="c">${u.hours == null ? "" : fmt(u.hours)}</td><td class="c">${esc(td(stds.join(", ")))}</td>
        <td class="c">${esc(td(nos.join(", ")))}</td><td class="c">${fmt(its.reduce((a, i) => a + i.max_score, 0))}</td><td>${esc(u.task || "")}</td><td></td></tr>`;
    });
    const loose = d.items.filter((i) => i.term_number === term && i.kind === "indicator" && !tu.some((u) => u.id === i.unit_id));
    for (const it of loose) rows.push(`<tr><td class="c">–</td><td>${esc(it.title)}</td><td></td><td class="c">${esc(td(splitCode(it.code).std))}</td><td class="c">${esc(td(splitCode(it.code).no))}</td><td class="c">${fmt(it.max_score)}</td><td></td><td>ไม่ระบุหน่วย</td></tr>`);
    const fin = d.items.filter((i) => i.term_number === term && i.kind === "final");
    const finMax = fin.reduce((a, i) => a + i.max_score, 0);
    return [`<tr class="band"><td colspan="8"><b>ภาคเรียนที่ ${td(term)}</b></td></tr>`, ...rows,
      fin.length ? (() => { const links = fin.flatMap((i) => i.indicators || []);
        const stds = [...new Set(links.map((x) => splitCode(x.code).std).filter(Boolean))], nos = links.map((x) => splitCode(x.code).no).filter(Boolean);
        return `<tr><td></td><td>สอบปลายภาค</td><td></td><td class="c">${esc(td(stds.join(", ")))}</td><td class="c">${esc(td(nos.join(", ")))}</td><td class="c">${fmt(finMax)}</td><td>แบบทดสอบ</td><td></td></tr>`; })() : ""];
  });
  // หน้าแนวตั้ง: คอลัมน์แคบลง ชื่อหน่วย/ภาระงานขึ้นบรรทัดใหม่ได้
  const structure = `<section class="sheet">${mark}
    ${head("โครงสร้างรายวิชา")}
    <table class="t small struct">
      <thead><tr><th style="width:18mm">หน่วยการ<br>เรียนรู้ที่</th><th>ชื่อหน่วยการเรียนรู้</th><th style="width:13mm">จำนวน<br>ชั่วโมง</th><th style="width:19mm">สาระ<br>มาตรฐาน</th>
        <th style="width:19mm">${W}<br>ข้อที่</th><th style="width:13mm">คะแนน</th><th style="width:33mm">ภาระงาน/ชิ้นงาน/<br>การประเมิน</th><th style="width:15mm">หมายเหตุ</th></tr></thead>
      <tbody>${structureRows.join("")}</tbody>
    </table>
  </section>`;

  // ---------- 3. บันทึกเวลาเรียน ----------
  // ครูผู้สอนไม่เช็กชื่อ — ใช้บันทึกการมาเรียนรายวันของครูประจำชั้น (ข ขาด · ล ลากิจ · ป ลาป่วย · ส มาสาย)
  // ภาค 1 = จำนวนวันของภาค 1 · ภาค 2 = จำนวนวันทั้งปี + รวมขาด/ลาแยกภาค 1 / ภาค 2 และสิทธิ์สอบ (มส) ทั้งปี
  const offOf = (a) => (a["ข"] || 0) + (a["ล"] || 0) + (a["ป"] || 0);
  const attendance = `<section class="sheet">${mark}
    ${head("บันทึกเวลาเรียน")}
    <table class="t small fit${dense(false)}">
      <thead><tr><th rowspan="2" style="width:10mm">เลขที่</th><th rowspan="2" style="width:16mm">เลข<br>ประจำตัว</th><th rowspan="2">ชื่อ–สกุล</th>
        <th colspan="${TERM === 1 ? 5 : 4}">${TERM === 1 ? `จำนวนวัน ภาคเรียนที่ ${td(1)} (จากบันทึกการมาเรียนของครูประจำชั้น)` : "จำนวนวันทั้งปี (บันทึกการมาเรียน)"}</th>${TERM === 1 ? "" : `<th colspan="3">รวมขาด/ลา (วัน)</th><th rowspan="2" style="width:18mm">ผล</th>`}<th rowspan="2" style="width:18mm">สถานะ</th></tr>
        <tr><th style="width:12mm">ขาด</th><th style="width:12mm">ลากิจ</th><th style="width:12mm">ลาป่วย</th><th style="width:12mm">มาสาย</th>${TERM === 1 ? '<th style="width:15mm">รวมขาด/ลา</th>' : `<th style="width:12mm">ภาค ${td(1)}</th><th style="width:12mm">ภาค ${td(2)}</th><th style="width:13mm">ทั้งปี</th>`}</tr></thead>
      <tbody>${d.students.map((x) => {
        const k = d.computed[x.id], all = d.attendance?.[x.id] || {}, a = TERM === 1 ? (all.by_term?.[1] || {}) : all, n = (c) => a[c] ? td(a[c]) : "";
        const off = offOf(a), v = (m) => m ? td(m) : "";
        const ms = k.low_attendance || (d.results[x.id] || {}).special === "มส";
        return `<tr><td class="c">${td(x.number ?? "")}</td><td class="c">${esc(td(x.student_code))}</td><td class="nm">${esc(x.name)}</td>
          <td class="c">${n("ข")}</td><td class="c">${n("ล")}</td><td class="c">${n("ป")}</td><td class="c">${n("ส")}</td>
          ${TERM === 1 ? `<td class="c">${v(off)}</td>` : `<td class="c">${v(offOf(all.by_term?.[1] || {}))}</td><td class="c">${v(offOf(all.by_term?.[2] || {}))}</td><td class="c">${v(off)}</td><td class="c">${ms ? "มส" : "มีสิทธิ์"}</td>`}
          <td class="c">${statusNote(x)}</td></tr>`;
      }).join("")}</tbody>
    </table>
    <div class="note">เวลาเรียนรายวิชา ${td(c.hours_per_year)} ชั่วโมงต่อปี · ต้องมีเวลาเรียนไม่น้อยกว่าร้อยละ ${td(s.attendance_pass_pct)} จึงมีสิทธิ์รับการประเมิน${TERM === 1 ? ` (ตัดสินสิทธิ์สอบเมื่อจบปีในเล่มภาคเรียนที่ ${td(2)})` : ""} · ช่องว่าง = มาเรียนปกติ</div>
  </section>`;

  const all = TERM === 1 ? cover + structure + attendance + indicatorPages + termSummary
    : cover + structure + attendance + assessPage("rtw") + assessPage("trait") + indicatorPages + termSummary + yearSummary;
  // ฉบับร่าง: ท้ายทุกส่วนมีข้อความกำกับด้วย — หน้าสุดท้ายของตารางยาวที่มีเนื้อหาน้อยจะยังเห็นคำว่าฉบับร่างเต็มคำ
  return draft ? all.replaceAll("</section>", `<div class="draft-foot">ฉบับร่าง ยังไม่อนุมัติ — ใช้ตรวจทานเท่านั้น</div></section>`) : all;
}

document.getElementById("doc").innerHTML = books.map(book).join("");

// ให้แต่ละหน้าจบในกระดาษแผ่นเดียว: ถ้าเนื้อหาสูงเกินพื้นที่พิมพ์ (A4 หักขอบตาม @page) ลดขนาดตัวอักษรของตาราง
// ทีละ 0.25pt จนพอดี (ต่ำสุด 9pt) — ห้องเล็กไม่ถูกแตะ · ถ้ายังไม่พอ ตารางจะต่อหน้าถัดไปพร้อมหัวตารางซ้ำ
await document.fonts?.ready;
const MM = 96 / 25.4;
for (const sheet of document.querySelectorAll(".sheet")) {
  const table = sheet.querySelector("table.t.fit");
  if (!table) continue;
  const land = sheet.classList.contains("land");
  const room = (land ? 186 : 269) - 4; // เผื่อระยะขอบบนตอนพิมพ์ (3 มม.) + ความคลาดเคลื่อน
  const cs = getComputedStyle(sheet);
  const used = () => (sheet.scrollHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)) / MM;
  const note = sheet.querySelector(".note");
  let pt = parseFloat(getComputedStyle(table).fontSize) * 0.75;
  while (used() > room && pt > 9) {
    pt -= 0.25;
    table.style.fontSize = `${pt}pt`;
    table.style.lineHeight = "1";
    if (note) { note.style.fontSize = `${Math.min(11, pt)}pt`; note.style.marginTop = "1mm"; }
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ปพ.6 — แบบรายงานผลการพัฒนาคุณภาพผู้เรียนรายบุคคล</title>
<link rel="stylesheet" href="/print/print.css">
</head>
<body>
<div id="doc"><div class="status">กำลังเตรียมเอกสาร…</div></div>
<script type="module">
import { esc, params, get, toolbar, status, fmt, td, gradeOut, GRADE_TEXT } from "/print/print.js";
import { ASSESSMENT_GROUPS, summarizeGroup, summaryText, activityResult } from "/js/grading.js";

const p = params();
const q = new URLSearchParams({ grade: p.get("grade") || "", room: p.get("room") || "" });
if (p.get("year")) q.set("year", p.get("year"));
if (p.get("student")) q.set("student", p.get("student"));
let d;
try { d = await get(`/api/reports/room?${q}`); } catch (e) { status(e.message); throw e; }
const s = d.settings;
// นักเรียนที่ย้ายออก/ออกกลางคันไม่อยู่ในรายชื่อแล้ว (soft delete) — ดูประวัติได้ที่หน้า "นักเรียนย้ายเข้า/ย้ายออก"
toolbar(`ปพ.6 ${d.grade}/${d.room} ปีการศึกษา ${d.year.year_be}`);
document.title = `ปพ.6 ${d.grade}-${d.room} ${d.year.year_be}`;
const students = d.students;
if (!students.length) { status("ไม่มีนักเรียนในห้องนี้"); throw new Error("empty"); }

const levelText = (g, v) => summaryText(g, v);
// ความเห็นครูประจำชั้น (บันทึกในหน้าครูประจำชั้น) — แต่ละด้านใช้ของภาคเรียนล่าสุดที่กรอกไว้ (ภาค 2 ก่อน ภาค 1)
const CFIELDS = [["learn", "ด้านการเรียน"], ["habit", "ด้านอุปนิสัย"], ["health", "ด้านสุขภาพ"], ["other", "อื่น ๆ"]];
// น้ำหนัก/ส่วนสูง: ครั้งล่าสุดที่บันทึกในหน้าครูประจำชั้น
function bodyHtml(b = {}) {
  const last = Object.keys(b).map(Number).sort((x, y) => y - x).map((r) => b[r]).find((v) => v && (v.weight != null || v.height != null));
  return last ? `<div>น้ำหนัก ${last.weight == null ? "–" : fmt(last.weight)} กิโลกรัม · ส่วนสูง ${last.height == null ? "–" : fmt(last.height)} เซนติเมตร (ครั้งล่าสุด)</div>` : "";
}
function commentHtml(c = {}) {
  const rows = CFIELDS.map(([f, label]) => [label, (c[2]?.[f] || c[1]?.[f] || "").trim()]).filter(([, body]) => body);
  if (!rows.length) return '<div class="dots"></div>';
  return `<div style="font-size:14pt;line-height:1.35;border-bottom:1px dotted #000;padding-bottom:1mm">${rows.map(([label, body]) => `<div><b>${esc(label)}:</b> ${esc(body)}</div>`).join("")}</div>`;
}

function page(st) {
  const basic = st.subjects.filter((x) => x.subject_type === "basic");
  const add = st.subjects.filter((x) => x.subject_type === "additional");
  const row = (x) => `<tr><td class="c">${esc(td(x.code))}</td><td>${esc(x.name)}</td><td class="c">${td(x.hours_per_year)}</td>
    <td class="c">${x.total == null || x.missing || x.total_max !== 100 ? "" : fmt(x.total)}</td><td class="c"><b>${gradeOut(x.grade)}</b></td><td style="font-size:13pt">${esc(GRADE_TEXT[x.grade] || "")}</td></tr>`;
  const hours = st.subjects.reduce((a, x) => a + x.hours_per_year, 0);
  return `<section class="sheet">
    <div class="form-no">ปพ.6</div>
    <div style="display:grid;grid-template-columns:18mm 1fr;gap:4mm;align-items:center">
      <img src="/logo.png" alt="" style="width:18mm;height:18mm;object-fit:contain">
      <div><h2>แบบรายงานผลการพัฒนาคุณภาพผู้เรียนรายบุคคล</h2><div>${esc(s.school_name || "โรงเรียนวัดโบสถ์ (ราษฎร์รังสฤษฏ์)")} ${esc(s.school_area || "")}</div><div>ปีการศึกษา ${td(d.year.year_be)}</div></div>
    </div>
    <div class="info">
      <div>ชื่อ–สกุล <b>${esc(st.name)}</b></div><div>เลขประจำตัว ${esc(td(st.student_code))} &nbsp; เลขที่ ${td(st.number ?? "")}</div>
      <div>ชั้น ${esc(td(d.grade))}/${esc(td(d.room))}</div><div>เลขประจำตัวประชาชน ${esc(td(st.national_id || ""))}</div>
    </div>
    <table class="t tiny" style="font-size:14pt">
      <thead><tr><th style="width:22mm">รหัสวิชา</th><th>รายวิชา</th><th style="width:18mm">เวลาเรียน<br>(ชม.)</th><th style="width:18mm">คะแนน<br>(${td(100)})</th><th style="width:16mm">ผลการ<br>เรียน</th><th style="width:30mm">ความหมาย</th></tr></thead>
      <tbody>
        ${basic.length ? `<tr><td colspan="6"><b>รายวิชาพื้นฐาน</b></td></tr>${basic.map(row).join("")}` : ""}
        ${add.length ? `<tr><td colspan="6"><b>รายวิชาเพิ่มเติม</b></td></tr>${add.map(row).join("")}` : ""}
        <tr><td colspan="2" class="r"><b>รวมเวลาเรียน / ผลการเรียนเฉลี่ย</b></td><td class="c">${td(hours)}</td><td></td><td class="c"><b>${st.gpa == null ? "" : fmt(st.gpa)}</b></td><td></td></tr>
      </tbody>
    </table>
    <table class="t tiny" style="font-size:14pt">
      <thead><tr><th>การประเมิน</th><th style="width:42mm">ผลการประเมิน</th></tr></thead>
      <tbody>${ASSESSMENT_GROUPS.map((g) => g.type === "activity"
        ? g.items.map(([k, label], i) => `<tr><td>${i === 0 ? `<b>${g.title}</b><br>` : ""}&nbsp;&nbsp;${esc(label)}</td><td class="c">${levelText(g, activityResult(k, st.assessments))}</td></tr>`).join("")
        : `<tr><td><b>${g.title}</b></td><td class="c">${levelText(g, summarizeGroup(g, st.assessments))}</td></tr>`).join("")}</tbody>
    </table>
    <div style="margin-top:3mm">เวลาเรียน (ตามบันทึกการมาเรียนของครูประจำชั้น): ขาดเรียน ${td(st.attendance?.["ข"] || 0)} วัน · ลากิจ ${td(st.attendance?.["ล"] || 0)} วัน · ลาป่วย ${td(st.attendance?.["ป"] || 0)} วัน · มาสาย ${td(st.attendance?.["ส"] || 0)} วัน</div>
    ${bodyHtml(st.body)}
    <div style="margin-top:2mm">ความคิดเห็นของครูประจำชั้น</div>${commentHtml(st.comments)}
    <div class="signs" style="grid-template-columns:repeat(${Math.min(4, Math.max(1, d.homeroom_teachers.length) + 2)},1fr);gap:4mm;margin-top:6mm;font-size:${d.homeroom_teachers.length > 1 ? 13 : 14}pt">
      ${(d.homeroom_teachers.length ? d.homeroom_teachers : [""]).map((t) => `<div class="sign"><div class="line" style="margin:0 2mm 1mm"></div>(${esc(t || "..........................................")})<br>ครูประจำชั้น</div>`).join("")}
      <div class="sign"><div class="line" style="margin:0 2mm 1mm"></div>(${esc(s.director_name || "..........................................")})<br>ผู้อำนวยการโรงเรียน</div>
      <div class="sign"><div class="line" style="margin:0 2mm 1mm"></div>(..........................................)<br>ผู้ปกครอง</div>
    </div>
  </section>`;
}
document.getElementById("doc").innerHTML = students.map(page).join("");
</script>
</body>
</html>

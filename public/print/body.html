<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แบบบันทึกน้ำหนัก ส่วนสูง และภาวะโภชนาการ</title>
<link rel="stylesheet" href="/print/print.css">
<style>
  .bd { font-size: 13pt; line-height: 1.05; }
  .bd h1 { font-size: 18pt; text-align: center; margin: 0; }
  .bd .sub { text-align: center; margin-top: 1mm; }
  .bd table.t { margin-top: 2mm; table-layout: fixed; }
  .bd table.t th, .bd table.t td { padding: 0 2px; height: 6.2mm; text-align: center; }
  .bd table.t th { font-size: 12pt; line-height: 1; }
  .bd table.t td.n { text-align: left; padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bd table.t td.st { font-size: 11pt; white-space: nowrap; overflow: hidden; }
  .bd table.t td.flag { background: #ececec; font-weight: 700; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .bd table.t .r { border-left: 2px solid #000; }
  .bd tr { break-inside: avoid; }
  .bd .legend { font-size: 12pt; margin-top: 2mm; }
  .bd .signs { grid-template-columns: repeat(3, 1fr); margin-top: 6mm; gap: 4mm 12mm; break-inside: avoid; }
  .bd .sign .line { height: 7mm; }
  .bd .keep { break-inside: avoid; }
  .bd .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
</style>
</head>
<body>
<div id="doc"><div class="status">กำลังเตรียมเอกสาร…</div></div>
<script type="module">
import { esc, params, get, toolbar, status, td, fmt, fixed, thaiDate } from "/print/print.js";
import { analyzeBody, ageText, ageMonths, sexOf, loadGrowthRefs, WFH_LEVELS, HFA_LEVELS } from "/js/growth.js";

const p = params();
const q = new URLSearchParams({ grade: p.get("grade") || "", room: p.get("room") || "" });
if (p.get("year")) q.set("year", p.get("year"));
let d, refs;
try { [d, refs] = await Promise.all([get(`/api/homeroom?${q}`), loadGrowthRefs()]); } catch (e) { status(e.message); throw e; }
const students = d.students.filter((s) => s.enrollment_status === "enrolled");
if (!students.length) { status("ไม่มีนักเรียนในห้องนี้"); throw new Error("empty"); }
toolbar(`น้ำหนัก ส่วนสูง และภาวะโภชนาการ ชั้น ${d.grade}/${d.room} ${p.get("term") === "1" ? "ภาคเรียนที่ 1 " : p.get("term") === "2" ? "ภาคเรียนที่ 2 " : ""}ปีการศึกษา ${d.year.year_be}`);
document.title = `น้ำหนักส่วนสูง ${d.grade}-${d.room} ${d.year.year_be}`;
const school = d.school || {};
// ?term=1 = ครั้งที่ 1–2 (ภาคเรียนที่ 1) · ภาค 2/ไม่ระบุ = ครั้งที่ 1–4 ทั้งปี (ภาค 2 สรุปรวมภาค 1)
const TERM = p.get("term") === "1" ? 1 : p.get("term") === "2" ? 2 : null;
const ROUNDS = TERM === 1 ? [1, 2] : [1, 2, 3, 4];
const termText = TERM ? `ภาคเรียนที่ ${td(TERM)} ` : "";
const today = new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
const rows = students.map((s) => ({ s, sex: sexOf(s), r: ROUNDS.map((r) => {
  const b = d.body?.[s.id]?.[r] || {};
  return { b, a: analyzeBody(s, b, d.body_dates?.[s.id]?.[r] || today), date: d.body_dates?.[s.id]?.[r] };
}) }));
const used = ROUNDS.filter((_, i) => rows.some((x) => x.r[i].b.weight || x.r[i].b.height));
const dates = (i) => [...new Set(rows.map((x) => x.r[i].date).filter(Boolean))].sort();
const flagW = (l) => l && l !== "สมส่วน", flagH = (l) => l && !["ตามเกณฑ์", "ค่อนข้างสูง", "สูง"].includes(l);
const missingRef = rows.some((x) => x.r.some((y) => y.a?.why?.startsWith("รอตาราง") || y.a?.why?.includes("รอตาราง")));
const dots = "..........................................";
const signs = `<div class="signs">${(d.teachers?.length ? d.teachers : [""]).map((t) => `<div class="sign"><div class="line"></div>(${esc(t || dots)})<br>ครูประจำชั้น</div>`).join("")}
  <div class="sign"><div class="line"></div>(${esc(school.director || dots)})<br>ผู้อำนวยการโรงเรียน</div></div>`;
const criteria = `เกณฑ์ของกรมอนามัย: อายุไม่เกิน 5 ปี ใช้มาตรฐานการเจริญเติบโตขององค์การอนามัยโลก (WHO 2006) · อายุ 6–19 ปี ใช้เกณฑ์อ้างอิงการเจริญเติบโตของเด็กอายุ 6–19 ปี (กรมอนามัย 2564)
  · รูปร่าง (น้ำหนักตามเกณฑ์ส่วนสูง): ต่ำกว่า −2 SD ผอม · −2 ถึง −1.5 SD ค่อนข้างผอม · −1.5 ถึง +1.5 SD สมส่วน · +1.5 ถึง +2 SD ท้วม · +2 ถึง +3 SD เริ่มอ้วน · เกิน +3 SD อ้วน
  · ส่วนสูงตามเกณฑ์อายุ: ต่ำกว่า −2 SD เตี้ย · −2 ถึง −1.5 SD ค่อนข้างเตี้ย · −1.5 ถึง +1.5 SD ตามเกณฑ์ · +1.5 ถึง +2 SD ค่อนข้างสูง · เกิน +2 SD สูง
  · สูงดีสมส่วน = ส่วนสูงตามเกณฑ์ขึ้นไป และรูปร่างสมส่วน`;

const main = `<section class="sheet land bd">
  <h1>แบบบันทึกน้ำหนัก ส่วนสูง และภาวะโภชนาการ</h1>
  <div class="sub">${esc(school.name || "โรงเรียนวัดโบสถ์ (ราษฎร์รังสฤษฏ์)")} · ชั้น ${esc(d.grade)}/${esc(d.room)} · ${termText}ปีการศึกษา ${td(d.year.year_be)} · นักเรียน ${td(students.length)} คน</div>
  <table class="t"><colgroup><col style="width:8mm"><col style="width:44mm"><col style="width:7mm"><col style="width:19mm">${ROUNDS.map(() => '<col style="width:10mm"><col style="width:10mm"><col style="width:16mm"><col style="width:16mm">').join("")}</colgroup>
    <thead><tr><th rowspan="2">เลขที่</th><th rowspan="2">ชื่อ–สกุล</th><th rowspan="2">เพศ</th><th rowspan="2">อายุ<br>(ณ วันนี้)</th>
      ${ROUNDS.map((r, i) => `<th colspan="4" class="r">ครั้งที่ ${td(r)}${dates(i).length ? `<br><span style="font-weight:400;font-size:11pt">${dates(i).length === 1 ? thaiDate(dates(i)[0], true) : `${thaiDate(dates(i)[0], true)} – ${thaiDate(dates(i).at(-1), true)}`}</span>` : ""}</th>`).join("")}</tr>
      <tr>${ROUNDS.map(() => '<th class="r">นน.<br>(กก.)</th><th>สส.<br>(ซม.)</th><th>รูปร่าง</th><th>ส่วนสูง</th>').join("")}</tr></thead>
    <tbody>${rows.map(({ s, sex, r }) => `<tr><td>${td(s.number ?? "")}</td><td class="n">${esc(s.name)}</td><td>${sex || ""}</td>
      <td class="st">${td(ageText(ageMonths(s.birth_date, today)))}</td>
      ${r.map(({ b, a }) => `<td class="r">${b.weight != null ? fmt(b.weight) : ""}</td><td>${b.height != null ? fmt(b.height) : ""}</td>
        <td class="st ${flagW(a?.wfh?.label) ? "flag" : ""}">${a ? (a.wfh?.label || "–") : ""}</td><td class="st ${flagH(a?.hfa?.label) ? "flag" : ""}">${a ? (a.hfa?.label || "–") : ""}</td>`).join("")}</tr>`).join("")}</tbody>
  </table>
  <div class="legend">${criteria} · ช่องสีเทา = ควรติดตาม · "–" = ประเมินไม่ได้ (ไม่มีวันเกิด/เพศ${missingRef ? " หรือยังไม่มีตารางเกณฑ์ 6–19 ปีในระบบ" : ""})</div>
  ${signs}
</section>`;

// สรุปจำนวนนักเรียนตามภาวะโภชนาการ รายครั้ง + สูงดีสมส่วน + รายชื่อที่ควรติดตาม (ครั้งล่าสุด)
const pct = (n, all) => (all ? fixed((n / all) * 100, 2) : "");
const block = (title, levels, key) => `<table class="t keep"><thead><tr><th style="width:40mm">${title}</th>${used.map((r) => `<th>ครั้งที่ ${td(r)}<br>คน (ร้อยละ)</th>`).join("") || "<th>ยังไม่มีข้อมูล</th>"}</tr></thead>
  <tbody>${levels.map((l) => `<tr><td class="n">${l}</td>${used.map((r) => { const all = rows.filter((x) => x.r[r - 1].a?.[key]).length, n = rows.filter((x) => x.r[r - 1].a?.[key]?.label === l).length;
    return `<td>${n ? `${td(n)} (${pct(n, all)})` : ""}</td>`; }).join("")}</tr>`).join("")}
    <tr><td class="n"><b>ประเมินได้</b></td>${used.map((r) => `<td><b>${td(rows.filter((x) => x.r[r - 1].a?.[key]).length)}</b></td>`).join("")}</tr></tbody></table>`;
const latest = rows.map((x) => ({ ...x, last: [...x.r].reverse().find((y) => y.a) })).filter((x) => x.last);
const watch = latest.filter((x) => flagW(x.last.a.wfh?.label) || flagH(x.last.a.hfa?.label));
const summary = `<section class="sheet bd">
  <h1>สรุปภาวะโภชนาการ</h1>
  <div class="sub">${esc(school.name || "โรงเรียนวัดโบสถ์ (ราษฎร์รังสฤษฏ์)")} · ชั้น ${esc(d.grade)}/${esc(d.room)} · ${termText}ปีการศึกษา ${td(d.year.year_be)}</div>
  ${block("รูปร่าง (น้ำหนักตามเกณฑ์ส่วนสูง)", WFH_LEVELS, "wfh")}
  ${block("ส่วนสูงตามเกณฑ์อายุ", HFA_LEVELS, "hfa")}
  <table class="t keep"><thead><tr><th style="width:40mm">สูงดีสมส่วน</th>${used.map((r) => `<th>ครั้งที่ ${td(r)}</th>`).join("")}</tr></thead>
    <tbody><tr><td class="n">คน (ร้อยละ)</td>${used.map((r) => { const all = rows.filter((x) => x.r[r - 1].a?.good != null).length, n = rows.filter((x) => x.r[r - 1].a?.good).length;
      return `<td>${all ? `${td(n)} / ${td(all)} (${pct(n, all)})` : "–"}</td>`; }).join("")}</tr></tbody></table>
  <div class="legend">ร้อยละคิดจากจำนวนนักเรียนที่ประเมินได้ในครั้งนั้น ตัดทศนิยมตำแหน่งที่ 3 ทิ้ง ไม่ปัด · ${criteria}</div>
  <h3 style="margin:4mm 0 0">นักเรียนที่ควรติดตาม (จากการวัดครั้งล่าสุด) ${td(watch.length)} คน</h3>
  ${watch.length ? `<table class="t keep"><thead><tr><th style="width:11mm">เลขที่</th><th>ชื่อ–สกุล</th><th style="width:27mm">อายุ</th><th style="width:14mm">นน.</th><th style="width:14mm">สส.</th><th style="width:26mm">รูปร่าง</th><th style="width:26mm">ส่วนสูง</th></tr></thead>
    <tbody>${watch.map(({ s, last }) => `<tr><td>${td(s.number ?? "")}</td><td class="n">${esc(s.name)}</td><td>${td(ageText(last.a.months))}</td><td>${fmt(last.b.weight)}</td><td>${fmt(last.b.height)}</td>
      <td class="${flagW(last.a.wfh?.label) ? "flag" : ""}">${last.a.wfh?.label || "–"}</td><td class="${flagH(last.a.hfa?.label) ? "flag" : ""}">${last.a.hfa?.label || "–"}</td></tr>`).join("")}</tbody></table>`
    : `<p>${latest.length ? "ไม่มี — ทุกคนที่ประเมินได้อยู่ในเกณฑ์" : "ยังไม่มีข้อมูลน้ำหนักส่วนสูง"}</p>`}
  ${signs}
</section>`;

document.getElementById("doc").innerHTML = main + summary;
</script>
</body>
</html>

<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หนังสือแจ้งผู้ปกครอง — นักเรียนขาดเรียน</title>
<link rel="stylesheet" href="/print/print.css">
</head>
<body>
<div id="doc"><div class="status">กำลังเตรียมเอกสาร…</div></div>
<script type="module">
import { esc, params, get, toolbar, status, td, thaiDate, todayIso, directorTitleHtml } from "/print/print.js";
const p = params();
const q = new URLSearchParams({ grade: p.get("grade") || "", room: p.get("room") || "", student: p.get("student") || "" });
if (p.get("year")) q.set("year", p.get("year"));
if (p.get("term") === "1" || p.get("term") === "2") q.set("term", p.get("term")); // เฉพาะวันขาด/ลาของภาคเรียนนั้น
let d;
try { d = await get(`/api/reports/absence?${q}`); } catch (e) { status(e.message); throw e; }
toolbar(`หนังสือแจ้งผู้ปกครอง ${d.student.name}`);
const s = d.settings, g = d.guardian;
const REASON = { sick: "ป่วย", personal: "ลากิจ", unknown: "ขาดเรียน", other: "อื่น ๆ" };
const guardianName = [g.guardian_prefix, g.guardian_first_name, g.guardian_last_name].filter(Boolean).join(" ").trim();
// เติมคำนำหน้า (ตำบล/อำเภอ/จังหวัด) เฉพาะเมื่อข้อมูลยังไม่มี
const pre = (label, v) => !v ? "" : String(v).trim().startsWith(label) ? String(v).trim() : `${label}${String(v).trim()}`;
const address = [g.house_number && `บ้านเลขที่ ${g.house_number}`, g.village_no && pre("หมู่ ", String(g.village_no).replace(/^หมู่(ที่)?\s*/, "")), g.road_soi, pre("ตำบล", g.subdistrict), pre("อำเภอ", g.district), pre("จังหวัด", g.province)].filter(Boolean).join(" ");
const unknown = d.absences.filter((a) => a.reason === "unknown").length;
document.getElementById("doc").innerHTML = `<section class="sheet">
  <img class="garuda" src="/assets/garuda.png" alt="" style="width:20mm;height:22mm;border-radius:0;margin:0 auto 2mm">
  <div style="display:flex;justify-content:space-between;align-items:flex-start"><div>ที่ ......................................</div><div class="right">${esc(s.school_name || "โรงเรียนวัดโบสถ์ (ราษฎร์รังสฤษฏ์)")}${s.school_area ? `<br>${esc(s.school_area)}` : ""}</div></div>
  <div class="center" style="margin-top:4mm">${thaiDate(todayIso())}</div>
  <p><b>เรื่อง</b> แจ้งการขาดเรียนของนักเรียน</p>
  <p><b>เรียน</b> ${esc(guardianName || "ผู้ปกครองนักเรียน")}${g.guardian_relationship ? ` (${esc(g.guardian_relationship)})` : ""}</p>
  ${address ? `<p style="margin-top:-2mm" class="muted">${esc(td(address))}</p>` : ""}
  <p style="text-indent:2.5cm;text-align:justify">ด้วย ${esc(d.student.name)} นักเรียนชั้น ${esc(td(d.grade))}/${esc(td(d.room))} เลขประจำตัว ${esc(td(d.student.student_code))}
    ได้ขาดเรียนใน${d.term ? `ภาคเรียนที่ ${td(d.term)} ` : ""}ปีการศึกษา ${td(d.year.year_be)} รวม ${td(d.absences.length)} วัน${unknown ? ` ในจำนวนนี้ขาดเรียนโดยไม่ได้ลา ${td(unknown)} วัน` : ""} ดังนี้</p>
  <table class="t small" style="width:80%;margin:0 auto">
    <thead><tr><th style="width:12mm">ที่</th><th>วันที่</th><th>สาเหตุ</th></tr></thead>
    <tbody>${d.absences.map((a, i) => `<tr><td class="c">${td(i + 1)}</td><td>${thaiDate(a.absence_date)}</td><td>${REASON[a.reason]}</td></tr>`).join("")}</tbody>
  </table>
  <p style="text-indent:2.5cm;text-align:justify;margin-top:4mm">การขาดเรียนบ่อยส่งผลต่อเวลาเรียน ซึ่งนักเรียนต้องมีเวลาเรียนไม่น้อยกว่าร้อยละ ${td(s.attendance_pass_pct)} ของเวลาเรียนทั้งหมดจึงจะมีสิทธิ์รับการประเมินผล
    โรงเรียนจึงขอแจ้งให้ท่านทราบ และขอความร่วมมือดูแลให้นักเรียนมาเรียนสม่ำเสมอ หากมีเหตุจำเป็นโปรดแจ้งครูประจำชั้น</p>
  <p style="text-indent:2.5cm">จึงเรียนมาเพื่อโปรดทราบและให้ความร่วมมือ</p>
  <div class="signs" style="grid-template-columns:1fr 1fr">
    <div></div>
    <div class="sign">ขอแสดงความนับถือ<div class="line"></div>(${esc(s.director_name || "................................................")})<br>${directorTitleHtml(s.school_name)}</div>
  </div>
  <div style="margin-top:10mm;border-top:1px dashed #000;padding-top:3mm">
    <b>ส่วนที่ผู้ปกครองตอบกลับ</b> &nbsp; ได้รับทราบการขาดเรียนของ ${esc(d.student.name)} แล้ว สาเหตุ ...................................................................................
    <div class="signs" style="margin-top:4mm"><div></div><div class="sign"><div class="line"></div>(.....................................................)<br>ผู้ปกครอง วันที่ ........./................./.............</div></div>
  </div>
</section>`;
</script>
</body>
</html>
